[package]
name        = "qrcode-nv"
version     = "0.0.2"
description = "QR Code symbols to ISO/IEC 18004: the four data modes with segment planning, all forty versions, the four error-correction levels, Reed-Solomon block interleaving, the eight data masks chosen by the standard's own penalty score, and rendering to text, to an SVG document and to a one-byte-per-module raster mask.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  Encoding a QR Code is arithmetic over a string the caller
# already holds: bit packing, a Reed-Solomon remainder over GF(256),
# eight mask trials and a penalty score.  Nothing is read from a file,
# no clock is consulted and no random number is drawn — the mask is
# chosen by the penalty score of ISO/IEC 18004 § 7.8.3.1, which is
# deterministic.  Writing the SVG or the PNG out is the caller's
# effect, spent once, where it can be seen.
layer       = "core"

category    = "graphics"

tags        = ["qr", "qrcode", "iso-18004", "barcode", "reed-solomon", "svg", "encoder", "sans-io"]
repository  = "https://github.com/novolang/qrcode-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.9.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "QR Code symbols to ISO/IEC 18004, rendered to text, SVG and a raster mask"

[dependencies]
# svg-nv supplies the document tree `to_svg` answers with.  The
# alternative was for this package to concatenate `<rect>` elements
# into a string, which is how most QR libraries do it and is why most
# of them cannot be embedded in a larger drawing: a caller that wants
# the symbol inside a label, under a transform, beside a caption, needs
# a NODE, not a finished file.  `svgdoc.path` takes the one path this
# package builds and `svgwrite.to_string` serialises it, so the caller
# chooses between a node and a file rather than being handed a file.
# `core`, so the layer rule holds.
svg-nv = "^0.1.0"

# color-nv supplies `Srgba8`, the type svg-nv's styles are painted
# with.  A QR Code has exactly two colours and the standard is strict
# about which is which — ISO/IEC 18004 § 6.2 requires the dark modules
# to be the darker of the two and the reflectance difference to be
# large — so the two colours are parameters of the render options
# rather than constants, and they are spelled in the same type the
# drawing library uses so that no conversion happens at the boundary.
# `core`, so the layer rule holds.
color-nv = "^0.1.1"
